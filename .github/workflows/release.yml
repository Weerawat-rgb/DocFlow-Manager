name: Release

# push tag เช่น v1.5.0 -> build BillingProgram.exe บน Windows -> สร้าง GitHub Release พร้อมไฟล์ zip
# push สาขา claude/** -> build อย่างเดียว (ดาวน์โหลด zip ได้จากหน้า Actions)
on:
  push:
    tags:
      - "v*"
    branches:
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version in main.py matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          # tag v1.4.0 -> ต้องมี "v1.4" ใน title ของ main.py
          short="$(echo "${GITHUB_REF_NAME}" | cut -d. -f1-2)"
          if ! grep -q "${short}\"" main.py; then
            echo "::error::main.py title ไม่ตรงกับ tag ${GITHUB_REF_NAME} (คาดว่าจะเป็น ${short})"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q .

      - name: Build exe
        run: pyinstaller BillingProgram.spec --noconfirm --clean

      - name: Package
        shell: pwsh
        run: |
          # ห้ามแนบ config.json (มีรหัสผ่านฐานข้อมูล)
          if (Get-ChildItem dist/BillingProgram -Recurse -Filter config.json) {
            throw "พบ config.json ใน dist - ยกเลิกการ release"
          }
          if ("${{ github.ref_type }}" -eq "tag") { $ver = "${{ github.ref_name }}" }
          else { $ver = "build-" + "${{ github.sha }}".Substring(0, 7) }
          $name = "BillingProgram-$ver.zip"
          Compress-Archive -Path dist/BillingProgram/* -DestinationPath $name
          echo "ZIP_NAME=$name" >> $env:GITHUB_ENV

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillingProgram
          path: ${{ env.ZIP_NAME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: โปรแกรมออกใบวางบิล ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            ### การติดตั้ง
            1. ดาวน์โหลด `BillingProgram-${{ github.ref_name }}.zip` แล้วแตกไฟล์
            2. วางไฟล์ `config.json` (ของแต่ละเครื่อง) ไว้ข้าง `BillingProgram.exe`
            3. ต้องติดตั้ง ODBC Driver 17 for SQL Server
